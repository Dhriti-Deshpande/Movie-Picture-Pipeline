name: Backend Continuous Integration

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv and Dependencies
        run: |
          cd starter/backend
          pip install pipenv
          pipenv install --dev

      - name: Run Linter
        run: |
          cd starter/backend
          pipenv run flake8 || pipenv run lint || true

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv and Dependencies
        run: |
          cd starter/backend
          pip install pipenv
          pipenv install --dev

      - name: Run Tests
        run: |
          cd starter/backend
          pipenv run pytest

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          cd starter/backend
          docker build -t mp-backend:latest .
name: Frontend Continuous Integration

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd starter/frontend
          npm ci || npm install

      - name: Run Linter
        run: |
          cd starter/frontend
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd starter/frontend
          npm ci || npm install

      - name: Run Tests
        run: |
          cd starter/frontend
          CI=true npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd starter/frontend
          npm ci || npm install

      - name: Run Tests
        run: |
          cd starter/frontend
          CI=true npm test

      - name: Build Docker Image
        run: |
          cd starter/frontend
          REACT_APP_MOVIE_API_URL="http://localhost:5000"
          docker build --build-arg REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL -t mp-frontend:latest .